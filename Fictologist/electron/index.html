<!DOCTYPE html>
<html>
    <head>
        <title>Fictologist</title>
        <link rel="stylesheet", href="style.css">
        <script async src="functions.js"></script>
    </head>
    <body>
        <div id="sidebar">
            <button>Documents</button>
            <button>Historian</button>

            <hr>

            <h2 id="projectName">Project</h2>
        </div>

        <div id="main">
            <div id="chatPage">
                <h2>Fictologist</h2>
                <div id="chat"></div>
                <input id="user-input" placeholder="The historian is listening..."/>
                <button onclick="send()">Ask</button>
            </div>

            <div id="entryPage">
                <h2>Create Entry</h2>
                <input id="project_input" placeholder="New Project"/>
                <input id="entry_id" placeholder="New Entry"/>
                <textarea id="entry_content" placeholder="A new story..."></textarea>

                <button onclick="addEntry()">Save Entry</button>
            </div>

        </div>

    </body>
</html>
